services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forma_store
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma_dev_password
    ports:
      - "5433:5432"
    volumes:
      - forma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma_store"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  forma_pgdata:
